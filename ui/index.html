<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
</head>

<body>
    <!-- Navbar -->
    <header id="navbar-container">
        <div id="heading-app">
            <img src="https://res.cloudinary.com/iuvfjdgy/image/upload/v1789459814/skypulse-logo_r4zoyh.png"
                class="logo" alt="SkyPulse Logo">

            <h3>
                <span class="sky-text">Sky</span><span class="pulse-text">Pulse</span>
            </h3>
            <!-- Laptop search -->
            <div class="search-box">
                <form id="desktop-form">
                    <i class="fa-solid fa-magnifying-glass magnifying-glass"></i>
                    <input type="text" name="search" placeholder="Search for location" id="search-city">
                    <i class="fa-solid fa-xmark fa-lg remove-search"></i>
                </form>
            </div>
        </div>

        <!-- Mobile search -->
        <div class="search-box-second">
            <form id="mobile-form">
                <!-- <i class="fa-solid fa-magnifying-glass magnifying-glass"></i> -->
                <input type="text" name="search" placeholder="Search for location" id="input-city">
                <i class="fa-solid fa-xmark fa-lg remove-search"></i>
            </form>
            <i class="fa-solid fa-xmark fa-lg close-search"></i>
        </div>

        <nav class="site-nav" id="site-nav">
            <!-- Mobile search button -->
            <i class="fa-solid fa-magnifying-glass magnifying-glass-second"
                style="color: #A7B2BD; cursor: pointer;"></i>
            <i class="fa-solid fa-gear fa-xl" style="color: #A7B2BD;;"></i>
        </nav>
    </header>

    <!-- location Name -->
    <main class="weather-main">
        <!---Loading animation-->
        <div id="loading-overlay">
            <div class="loader" role="status" aria-label="Loading weather">
                <div class="skypulse-logo">
                    <svg class="weather-mark" viewBox="0 0 145 64" aria-hidden="true">
                        <!-- Stable sun -->
                        <g class="sun">
                            <circle cx="27" cy="28" r="12" />
                            <path d="M27 7v-5M27 54v-5M6 28H1M53 28h-5M12 13l-4-4M42 43l-4-4M42 13l4-4M12 43l-4 4" />
                        </g>

                        <path class="loader-cloud-shape" fill="#eaf7ff"
                            d="M56 45H25c-6 0-10-4-10-9s4-9 9-9c2 0 4 1 5 2c2-4 6-6 11-6c7 0 12 5 13 11h3c5 0 9 3 9 7s-4 4-9 4z" />
                        <!-- Animated cyan waveform -->
                        <path class="pulse-wave" d="M65 37h10l5-10 7 22 7-15 5 3h30" />
                    </svg>
                </div>

                <p>Loading weather...</p>
            </div>
        </div>

        <div class="nav-main">
            <div class="location-Date">
                <h2 class="city"></h2>
                <div class="nav-date"></div>
            </div>
            <div class="live-rader">
                <h4>Live Radar</h4>
            </div>
        </div>

        <!-- Temperature Details -->
        <section class="temp-card">

            <!-- Error message -->
            <div id="weather-error" class="weather-error"></div>

            <!-- Weather content -->
            <div id="weather-content">
                <div id="temp-submain" class="temp-current">
                    <div class="temp-submain"></div>101a2d
                    <h4 class="current-observation">• CURRENT OBSERVATION</h4>
                    <div class="temperature"></div>
                    <div class="temperature-details"></div>
                </div>

                <div id="temp-hour" class="temp-hourly">
                    <div class="temp-submain"></div>
                    <div class="temperature-hours">
                        <h2>24-Hour Forecast</h2>

                        <div class="trend-chart">
                            <canvas id="weather-trend-chart" class="weather-trend-chart"></canvas>
                        </div>
                        <div id="trend-hours" class="temp-hours"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="day-forecast">
            <div class="forecast-heading">
                <h2>5-Day Extended Outlook</h2>
            </div>
            <div class="temp-forecast" id="scrollbar-hide"></div>
        </section>


    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="index.js"></script>
</body>

</html>
