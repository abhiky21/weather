<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
</head>

<body>
    <!-- Navbar -->
    <header id="navbar-container">
        <div id="heading-app">
            <i class="fa-solid fa-cloud-sun fa-xl"></i>
            <h3>Weather App</h3>
            <!-- Laptop search -->
            <div class="search-box">
                <form id="desktop-form">
                    <i class="fa-solid fa-magnifying-glass magnifying-glass"></i>
                    <input type="text" name="search" placeholder="Search for location" id="search-city">
                    <i class="fa-solid fa-xmark fa-lg remove-search"></i>
                </form>
            </div>
        </div>

        <!-- Mobile search -->
        <div class="search-box-second">
            <form id="mobile-form">
                <!-- <i class="fa-solid fa-magnifying-glass magnifying-glass"></i> -->
                <input type="text" name="search" placeholder="Search for location" id="input-city">
                <i class="fa-solid fa-xmark fa-lg remove-search"></i>
            </form>
            <i class="fa-solid fa-xmark fa-lg close-search"></i>
        </div>

        <nav class="site-nav" id="site-nav">
            <!-- Mobile search button -->
            <i class="fa-solid fa-magnifying-glass magnifying-glass-second"
                style="color: #A7B2BD; cursor: pointer;"></i>
            <i class="fa-solid fa-gear fa-xl" style="color: #A7B2BD;;"></i>
        </nav>
    </header>

    <!-- location Name -->
    <main class="weather-main">
        <!---Loading animation-->
        <div id="loading-overlay">
            <div class="loader"></div>
            <p>Loading weather...</p>
        </div>

        <div class="nav-main">
            <div class="location-Date">
                <h2 class="city"></h2>
                <div class="nav-date"></div>
            </div>
            <div class="live-rader">
                <h4>Live Radar</h4>
            </div>
        </div>

        <!-- Temperature Details -->
        <section class="temp-card">

            <!-- Error message -->
            <div id="weather-error" class="weather-error"></div>

            <!-- Weather content -->
            <div id="weather-content">
                <div id="temp-submain" class="temp-current">
                    <div class="temp-submain"></div>101a2d
                    <h4 class="current-observation">• CURRENT OBSERVATION</h4>
                    <div class="temperature"></div>
                    <div class="temperature-details"></div>
                </div>

                <div id="temp-hour" class="temp-hourly">
                    <div class="temp-submain"></div>
                    <div class="temperature-hours">
                        <h2>24-Hour Forecast</h2>

                        <div class="trend-chart">
                            <canvas id="weather-trend-chart" class="weather-trend-chart"></canvas>
                        </div>
                        <div id="trend-hours" class="temp-hours"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="day-forecast">
            <div class="forecast-heading">
                <h2>5-Day Extended Outlook</h2>
            </div>
            <div class="temp-forecast" id="scrollbar-hide"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="index.js"></script>
</body>

</html>
