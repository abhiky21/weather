<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.12/css/weather-icons.min.css" />
</head>

<body>
    <!-- Navbar -->
    <header id="navbar-container">

        <div id="heading-app">
            <i class="fa-solid fa-cloud-sun fa-xl"></i>
            <h3>Weather App</h3>

            <!-- Laptop search -->
            <div class="search-box">
                <form id="desktop-form">
                    <i class="fa-solid fa-magnifying-glass magnifying-glass"></i>
                    <input type="text" name="search" placeholder="Search for location" id="search-city">
                </form>
            </div>

        </div>


        <!-- Mobile search -->
        <div class="search-box-second">

            <form id="mobile-form">
                <i class="fa-solid fa-magnifying-glass magnifying-glass"></i>
                <input type="text" name="search" placeholder="Search for location" id="input-city">
            </form>

            <i class="fa-solid fa-xmark fa-lg close-search"></i>

        </div>


        <nav class="site-nav" id="site-nav">

            <!-- Mobile search button -->
            <i class="fa-solid fa-magnifying-glass magnifying-glass-second"
                style="color: rgb(0, 0, 0); cursor: pointer;"></i>
            <i class="fa-solid fa-gear fa-xl"></i>

        </nav>

    </header>

    <!-- location Name -->
    <main class="weather-main">

        <div id="loading-overlay">
            <div class="loader"></div>
            <p>Loading weather...</p>
        </div>

        <div class="nav-main">
            <h2 class="city"></h2>
            <div class="nav-date"></div>
        </div>

        <!-- Temperature Details -->
        <section class="temp-card">

            <!-- Error message -->
            <div id="weather-error" class="weather-error"></div>

            <!-- Weather content -->
            <div id="weather-content">

                <div id="temp-submain" class="temp-sub">
                    <div class="temp-submain"></div>
                    <div class="temperature">
                    </div>
                    <div class="temperature-details">
                        <div id="temp-det-f" class="temp-det"></div>
                        <div id="temp-det-s" class="temp-det">
                        </div>
                    </div>
                </div>

                <div id="temp-hour" class="temp-sub">
                    <div class="temp-submain"></div>

                    <div class="temperature-hours">
                        <h2>24-Hour Forecast</h2>

                        <div class="temp-hours">
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <section class="day-forecast">
            <h2>5-Day Forecast</h2>
            <div class="temp-forecast" id="scrollbar-hide">
            </div>
        </section>
    </main>
    <script type="module" src="index.js"></script>
</body>

</html>
